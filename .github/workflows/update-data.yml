name: Update Marktdaten

on:
  schedule:
    # Alle 15 Minuten, Mo–Fr 6–19 Uhr UTC (= 8–21 Uhr deutsche Sommerzeit)
    - cron: '*/15 6-19 * * 1-5'
  workflow_dispatch:   # manueller Start im Actions-Tab möglich

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Daten abrufen
        run: python3 scripts/fetch_data.py
      - name: Commit & Push
        run: |
          git config user.name "aurora-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/*.json
          git diff --staged --quiet || git commit -m "Daten-Update $(date -u +%Y-%m-%d\ %H:%M)"
          git pull --rebase origin main || true
          git push || true
